/* Gera o rótulo de filial usado nos históricos (ex.: filial 1 = "MTZ", filial 3 = "FL 003") */
function filialLabel(fil){
  fil=String(fil||'').trim();
  if(!fil)return'';
  if(fil==='1')return'MTZ';
  return'FL '+fil.padStart(3,'0');
}

/* ═══════ IMPORTAÇÃO/EXPORTAÇÃO DE PARAMETRIZAÇÃO (Excel) ═══════
   Lê uma planilha no formato Winthor (aba ESTADUAIS: TIPO, NÚMERO, CODIGO RED, DATA,
   NATUREZA, DOC, COD H, COMPLEMENTO HISTORICO, CONCILIADO, FILIAL, VALOR) e converte em
   entradas de mapeamento{label,hist,deb,cred,ativo}, reaproveitando a estrutura já usada
   por getTipos()/buildMapaDom()/salvarEmp(). Não toca na leitura de PDF nem na geração
   dos arquivos de importação — só alimenta o formulário de Empresas. */
function slugify(s){
  var v=String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  return v.slice(0,40)||('tipo_'+Date.now());
}
/* Usada só internamente para AGRUPAR linhas que representam o mesmo "tipo" de lançamento
   (o mesmo histórico varia por filial/mês/nota). O texto normalizado NUNCA é salvo — o
   campo "hist" gravado é sempre o texto original da planilha, sem alterações. */
function normalizarParaComparacao(s){
  var v=String(s||'').toUpperCase().trim();
  v=v.replace(/\bMTZ\b/g,'{FIL}').replace(/\bFL\s*0*\d+\b/g,'{FIL}');
  v=v.replace(/\b\d{2}\/\d{4}\b/g,'{MES}');
  v=v.replace(/(NOTA\s*N[Oº]:\s*)\d+/g,'$1{NOTA}');
  return v.replace(/\s+/g,' ').trim();
}
function detectarChavePadrao(histNorm){
  if(/DIFEREN[ÇC]A DE AL[IÍ]QUOTAS/.test(histNorm))return'difal';
  if(/ART\.\s*62/.test(histNorm)&&/BENEF/.test(histNorm))return'benef_fiscal';
  if(/OPER\.\s*INTERESTADUAL/.test(histNorm)&&/ESTORNO/.test(histNorm))return'estorno_interestadual';
  if(/OPER\.\s*INTERNA/.test(histNorm)&&/ESTORNO/.test(histNorm))return'estorno_interna';
  if(/CR\.\s*OUT\./.test(histNorm))return'cr_out_atacadista';
  if(/APURA[ÇC][ÃA]O DE ICMS/.test(histNorm)&&/SAFRA/.test(histNorm))return'outros_creditos';
  if(/APURA[ÇC][ÃA]O DE ICMS/.test(histNorm)&&!/SAFRA/.test(histNorm))return'apuracao';
  return null;
}
/* Normaliza um cabeçalho de coluna p/ comparação tolerante (espaços/maiúsculas/acentos) */
function normHeader(s){
  return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}
function parseParametrizacaoWorkbook(wb){
  var sheetName=null;
  wb.SheetNames.forEach(function(n){if(normHeader(n)==='ESTADUAIS')sheetName=n;});
  if(!sheetName)return{erro:'Não encontrei a aba "ESTADUAIS" nesta planilha. Abas disponíveis: '+wb.SheetNames.join(', ')+'.'};
  var ws=wb.Sheets[sheetName];
  var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  var headerIdx=-1,cols={};
  /* aceita tanto os cabeçalhos originais do extrato Winthor quanto os da planilha exportada por
     exportarParametrizacaoExcel(), pra reimportação funcionar nos dois sentidos */
  var ALIASES={'TIPO':['TIPO'],'CODIGO RED':['CODIGO RED','COD RED','CODIGO REDUZIDO'],'NATUREZA':['NATUREZA'],'COD H':['COD H','CODH'],'COMPLEMENTO HISTORICO':['COMPLEMENTO HISTORICO','HISTORICO']};
  var canonicos=Object.keys(ALIASES);
  function achaAlias(rowNorm,canon){for(var a=0;a<ALIASES[canon].length;a++){var ix=rowNorm.indexOf(ALIASES[canon][a]);if(ix>=0)return ix;}return -1;}
  for(var i=0;i<Math.min(rows.length,10);i++){
    var r=rows[i].map(normHeader);
    var achou=canonicos.every(function(h){return achaAlias(r,h)>=0;});
    if(achou){
      headerIdx=i;
      canonicos.forEach(function(h){cols[h]=achaAlias(r,h);});
      var filIx=r.indexOf('FILIAL');if(filIx>=0)cols['FILIAL']=filIx;
      break;
    }
  }
  if(headerIdx<0){
    var faltando=[];
    canonicos.forEach(function(h){
      var acheiEmAlguma=false;
      for(var j=0;j<Math.min(rows.length,10);j++){if(achaAlias(rows[j].map(normHeader),h)>=0)acheiEmAlguma=true;}
      if(!acheiEmAlguma)faltando.push(h);
    });
    return{erro:'Não encontrei as colunas obrigatórias na aba ESTADUAIS: '+(faltando.length?faltando.join(', '):'TIPO, CODIGO RED, NATUREZA, COD H, COMPLEMENTO HISTORICO')+'.'};
  }
  var idxTipo=cols['TIPO'],idxCodRed=cols['CODIGO RED'],idxNat=cols['NATUREZA'],idxCodH=cols['COD H'],idxHist=cols['COMPLEMENTO HISTORICO'],idxFil=cols['FILIAL'];
  var body=rows.slice(headerIdx+1);
  var pares=[],pendD=null;
  body.forEach(function(r){
    if(!r||!r.length)return;
    var nat=String(r[idxNat]||'').trim().toUpperCase();
    if(!nat)return;
    if(nat==='D'){pendD=r;}
    else if(nat==='C'){if(pendD){pares.push({d:pendD,c:r});pendD=null;}}
  });
  var codHSet={},grupos={},ordem=[],usedSlugs={};
  pares.forEach(function(p){
    var deb=String(p.d[idxCodRed]||'').trim(),cred=String(p.c[idxCodRed]||'').trim();
    if(!deb||!cred)return;
    var tipoRaw=String(p.d[idxTipo]||p.c[idxTipo]||'').trim()||'TIPO';
    var codH=String(p.d[idxCodH]||p.c[idxCodH]||'').trim();if(codH)codHSet[codH]=true;
    var histRaw=String(p.d[idxHist]||'').trim()||String(p.c[idxHist]||'').trim();
    var fil=idxFil!==undefined?String(p.d[idxFil]||p.c[idxFil]||'').trim():'';
    var histNorm=normalizarParaComparacao(histRaw);
    var chavePadrao=detectarChavePadrao(histNorm);
    /* chave de deduplicação usa o texto normalizado INTEIRO (nunca truncado), pra não colapsar
       por engano dois tipos diferentes que só se distinguem depois da 6ª/7ª palavra */
    var mapKey=chavePadrao||('T:'+tipoRaw+'|H:'+histNorm);
    if(!grupos[mapKey]){
      var slug=chavePadrao;
      if(!slug){
        var base=slugify(tipoRaw)+'_'+slugify(histNorm);
        slug=base;var n=2;
        while(usedSlugs[slug]){slug=base+'_'+n;n++;} /* garante unicidade mesmo se o slug truncado colidir */
      }
      usedSlugs[slug]=true;
      grupos[mapKey]={key:slug,fromPadrao:!!chavePadrao,hist:histRaw,deb:deb,cred:cred,tipoRaw:tipoRaw,filiais:{},variantes:[]};
      ordem.push(mapKey);
    }
    var g=grupos[mapKey];
    if(fil)g.filiais[fil]=true;
    if(g.deb!==deb||g.cred!==cred){
      g.inconsistente=true;
      g.variantes.push({deb:deb,cred:cred,hist:histRaw});
    }
  });
  var tipos=ordem.map(function(k){
    var g=grupos[k];
    return{key:g.key,fromPadrao:g.fromPadrao,hist:g.hist,deb:g.deb,cred:g.cred,inconsistente:!!g.inconsistente,variantes:g.variantes,filiais:Object.keys(g.filiais),label:g.fromPadrao?null:(g.hist.replace(/\s+/g,' ').trim().slice(0,70)||g.tipoRaw)};
  });
  var codHValues=Object.keys(codHSet);
  return{tipos:tipos,codHValues:codHValues,totalLinhas:body.length,totalPares:pares.length};
}

function importarParametrizacaoExcel(ev){
  var input=ev.target,file=input.files&&input.files[0];
  var st=document.getElementById('ef-import-st');
  if(!file)return;
  if(!/\.(xlsx|xls)$/i.test(file.name)){
    if(st){st.textContent='Selecione um arquivo .xlsx ou .xls.';st.className='status-msg err';}
    input.value='';return;
  }
  if(st){st.textContent='Lendo planilha...';st.className='status-msg';}
  var reader=new FileReader();
  reader.onload=function(e){
    input.value='';
    var res;
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      res=parseParametrizacaoWorkbook(wb);
    }catch(err){
      if(st){st.textContent='Erro ao ler o arquivo: '+err.message;st.className='status-msg err';}
      return;
    }
    if(res.erro){if(st){st.textContent=res.erro;st.className='status-msg err';}return;}
    if(!res.tipos.length){if(st){st.textContent='Nenhum par débito/crédito válido foi encontrado na aba ESTADUAIS.';st.className='status-msg err';}return;}
    var novos=0,atualizados=0,inconsistentes=[];
    res.tipos.forEach(function(t){
      var card=_findTipoCard(t.key);
      if(card){
        var id=card.id.replace('tcard-','');
        _setTipoCardValores(id,{label:t.fromPadrao?undefined:t.label,hist:t.hist,deb:t.deb,cred:t.cred});
        atualizados++;
      } else {
        var l=document.getElementById('tipos-lista');
        if(l){var div=document.createElement('div');div.innerHTML=tipoCard(t.key,t.label||t.key,t.hist,t.deb,t.cred,true);l.appendChild(div.firstChild);}
        novos++;
      }
      if(t.inconsistente)inconsistentes.push(t.label||t.key);
    });
    var codhMsg='';
    if(res.codHValues.length===1){
      var chInp=document.getElementById('wt-codh');
      if(chInp){chInp.value=res.codHValues[0];codhMsg='COD H: '+res.codHValues[0]+' (preenchido).';}
      else codhMsg='COD H encontrado na planilha: '+res.codHValues[0]+' (este campo só aparece quando o sistema é Winthor — mude o "Sistema de importação" acima se quiser usá-lo).';
    } else if(res.codHValues.length>1){
      codhMsg='Atenção: encontrei mais de um COD H diferente na planilha ('+res.codHValues.join(', ')+') — não preenchi automaticamente, escolha manualmente no campo COD H.';
    }
    var resumo='Importação concluída. Linhas lidas: '+res.totalLinhas+' · Pares D/C encontrados: '+res.totalPares+
      ' · Tipos encontrados: '+res.tipos.length+' · Tipos novos: '+novos+' · Tipos atualizados: '+atualizados+
      ' · Tipos com inconsistência: '+inconsistentes.length+(inconsistentes.length?' ('+inconsistentes.join('; ')+')':'')+
      (codhMsg?' · '+codhMsg:'');
    var painel=document.getElementById('ef-import-resumo');
    if(painel){
      painel.innerHTML='<div class="alert '+(inconsistentes.length?'alert-warn':'alert-ok')+'"><i class="ti ti-'+(inconsistentes.length?'alert-triangle':'circle-check')+'"></i><span>'+esc(resumo)+' Revise os tipos abaixo antes de salvar.</span></div>';
    }
    if(st){st.textContent='';st.className='status-msg';}
  };
  reader.readAsArrayBuffer(file);
}
function exportarParametrizacaoExcel(k){
  var e=db.empresas[k];if(!e)return;
  var tipos=getTipos(e),fs=getFiliais(e);
  var filCol=fs.map(function(f){return f.fil;}).join(',');
  var cnpjCol=(fs[0]&&fs[0].cnpj)||e.cnpj||'';
  var aoa=[['CNPJ','EMPRESA','SISTEMA','FILIAL','TIPO','NATUREZA','CODIGO RED','COD H','HISTORICO','ATIVO']];
  var codH=(e.mapeamento||{}).cod_h||'';
  tipos.forEach(function(t){
    aoa.push([cnpjCol,e.nome,e.sistema||'',filCol,'C3','D',t.deb||'',codH,t.hist||'',t.ativo?'S':'N']);
    aoa.push([cnpjCol,e.nome,e.sistema||'',filCol,'C3','C',t.cred||'',codH,t.hist||'',t.ativo?'S':'N']);
  });
  var wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:20},{wch:24},{wch:10},{wch:14},{wch:6},{wch:9},{wch:12},{wch:8},{wch:70},{wch:7}];
  XLSX.utils.book_append_sheet(wb,ws,'ESTADUAIS');
  saveXlsx(wb,'PARAMETRIZACAO_'+(cnpjCol.replace(/\D/g,'')||slugify(e.nome))+'.xlsx');
}

/* ── Download de arquivos: no Claude passa pela confirmação do visualizador; localmente, download direto.
   Um arquivo por vez (o Claude só abre uma confirmação de cada vez). ── */
var _filaSave=Promise.resolve();
function saveFile(name,data){
  _filaSave=_filaSave.then(function(){
    if(downloadsCap){
      return downloadsCap.save({filename:name,data:data}).catch(function(err){
        if(err&&err.code!=='declined')avisoGlobal('Não foi possível baixar '+name+': '+(err.message||err.code));
      });
    }
    var blob=data instanceof Blob?data:new Blob([data]),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
  });
  return _filaSave;
}
function saveXlsx(wb,name){return saveFile(name,new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})));}
function dl(content,name){return saveFile(name,content);}

  if(a!==b){st.textContent='As duas senhas não são iguais.';st.className='status-msg err';return;}
  st.textContent='Salvando…';st.className='status-msg';

      return sb.auth.getUser().then(function(u){return entrarComSessao(u.data.user);});
    });

/* Reconstrói as linhas do PDF respeitando a posição (x,y) de cada item, em vez de apenas
   concatená-los na ordem em que aparecem no content-stream do PDF (ordem que NÃO corresponde
   à ordem visual de leitura neste layout, causando leitura de valores errados/trocados). */
function linesFromContent(content){
  var items=content.items.map(function(it){return{str:it.str,x:it.transform[4],y:it.transform[5]};})
    .filter(function(it){return it.str&&it.str.trim();});
  items.sort(function(a,b){return(b.y-a.y)||(a.x-b.x);});
  var lines=[],cur=null,TOL=2.5;
  items.forEach(function(it){
    if(cur&&Math.abs(cur.y-it.y)<=TOL){cur.items.push(it);}
    else{cur={y:it.y,items:[it]};lines.push(cur);}
  });
  return lines.map(function(l){
    l.items.sort(function(a,b){return a.x-b.x;});
    var s=l.items.map(function(it){return it.str;}).join(' ').replace(/\s+/g,' ').trim();
    while(/^[A-ZÀ-Ü]\s+/.test(s)&&s.replace(/^[A-ZÀ-Ü]\s+/,'').length>2){s=s.replace(/^[A-ZÀ-Ü]\s+/,'');}
    return s;
  });
}

function readOnePdf(file){
  return new Promise(function(resolve){
    var reader=new FileReader();
    reader.onload=function(ev){
      pdfjsLib.getDocument({data:new Uint8Array(ev.target.result)}).promise.then(function(pdf){
        var arr=[];for(var i=1;i<=pdf.numPages;i++)arr.push(pdf.getPage(i));
        Promise.all(arr).then(function(pl){return Promise.all(pl.map(function(p){return p.getTextContent();}));})
        .then(function(cs){
          var lines=[];cs.forEach(function(c){lines=lines.concat(linesFromContent(c));});
          var parsed=parsePdfLines(lines);
          var match=matchEmpresaByCnpj(parsed.cnpj);
          resolve({nome:file.name,mesano:parsed.mesano,cnpj:parsed.cnpj,lancamentos:parsed.lancamentos,itens:parsed.itens,resumo:parsed.resumo,empresaKey:match?match.key:null,filial:match?match.fil:null});
        });
      }).catch(function(err){resolve({nome:file.name,erro:err.message});});
    };
    reader.readAsArrayBuffer(file);
  });
}

function loadPdfs(fileList){
  var files=Array.prototype.slice.call(fileList).filter(function(f){return /\.pdf$/i.test(f.name);});
  if(!files.length)return;
  var dn=document.getElementById('drop-name');dn.style.display='block';dn.textContent='Lendo '+files.length+' PDF(s)...';
  Promise.all(files.map(readOnePdf)).then(function(results){
    results.forEach(function(r){r.id='a'+Date.now()+Math.random().toString(36).slice(2,7);arquivos.push(r);});
    document.getElementById('drop').classList.add('done');
    dn.textContent=arquivos.length+' PDF(s) carregado(s)';
    renderPreviewAll();
  });
}

function parseValorBR(s){
  if(s===undefined||s===null)return NaN;
  s=String(s).trim();if(!s)return NaN;
  s=s.replace(/\./g,'').replace(',','.');
  return parseFloat(s);
}
function extrairCnpj(text){
  var m=text.match(/(\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2})/);
  return m?m[1]:'';
}
function normCnpj(s){return String(s||'').replace(/\D/g,'');}
/* Uma empresa pode ser um "grupo" com várias filiais (mesmo mapeamento de contas, CNPJs e
   códigos FIL diferentes). Retorna sempre a lista de filiais, migrando registros antigos
   (cnpj/filial únicos) para o novo formato em memória, sem precisar reescrever o localStorage. */
function getFiliais(e){
  if(e.filiais&&e.filiais.length)return e.filiais;
  if(e.cnpj)return[{cnpj:e.cnpj,fil:e.filial||'1'}];
  return[];
}
function matchEmpresaByCnpj(cnpj){
  var alvo=normCnpj(cnpj);if(!alvo)return null;
  var achado=null;
  Object.keys(db.empresas).forEach(function(k){
    if(achado)return;
    getFiliais(db.empresas[k]).forEach(function(f){
      if(achado)return;
      if(normCnpj(f.cnpj)===alvo)achado={key:k,fil:f.fil};
    });
  });
  return achado;
}
/* Padrão estrito de valor monetário BR: milhares com ponto, 2 casas decimais com vírgula. */
var CURR_RE_SRC='(\\d{1,3}(?:\\.\\d{3})*,\\d{2})';
function lastCurrencyInLine(line){
  var re=new RegExp(CURR_RE_SRC,'g'),mm,last=null;
  while((mm=re.exec(line))!==null)last=mm[1];
  return last?parseValorBR(last):NaN;
}
function valorNaLinha(lines,labelRe){
  for(var i=0;i<lines.length;i++){
    if(labelRe.test(lines[i])){
      var v=lastCurrencyInLine(lines[i]);
      if(!isNaN(v))return v;
    }
  }
  return NaN;
}
/* Agrupa as linhas de uma seção (002/003/006) em blocos por item numerado ("1 - ...", "2 - ...").
   Cada nota pode quebrar em várias linhas visuais e o valor pode cair no meio do bloco (não
   necessariamente na última linha), por isso concatenamos o bloco inteiro antes de buscar o valor. */
function parseItemBlocks(lines,startIdx,endMarkerRe){
  var blocks=[],i=startIdx,cur=null;
  var itemStartRe=/^(\d+)\s*-\s*/;
  for(;i<lines.length;i++){
    var line=lines[i];
    if(endMarkerRe.test(line))break;
    var mm=line.match(itemStartRe);
    if(mm){if(cur)blocks.push(cur);cur={num:mm[1],text:line};}
    else if(cur){cur.text+=' '+line;}
  }
  if(cur)blocks.push(cur);
  return blocks;
}
/* Extrai lançamentos a partir das linhas do PDF já reconstruídas por posição (x,y).
   Não usa nem altera variáveis globais. */
function parsePdfLines(lines){
  var lanc=[];
  var joined=lines.join(' ');
  var mesano='';var m=joined.match(/M[eê]s[^\d]*(\d{2}\/\d{4})/);if(m)mesano=m[1];
  var mm=mesano?parseInt(mesano.split('/')[0]):1,yy=mesano?parseInt(mesano.split('/')[1]):2025;
  var ld=new Date(yy,mm,0).getDate();
  var dd=String(ld).padStart(2,'0'),ms=String(mm).padStart(2,'0');
  var dDisp=dd+'/'+ms+'/'+yy,dFmt=String(yy)+ms+dd;

  var idx002=lines.findIndex(function(l){return/002\s*-\s*Outros\s*D[eé]bitos/i.test(l);});
  if(idx002>=0){
    parseItemBlocks(lines,idx002+1,/^Total\s+Outros\s+D[eé]bitos/i).forEach(function(b){
      if(/diferen[cç]a\s+de\s+al[ií]quotas/i.test(b.text)){
        var notaM=b.text.match(/Nota\s*N[oº]:\s*(\d+)/i);
        var val=lastCurrencyInLine(b.text);
        if(!isNaN(val)&&val>0)lanc.push({tipo:'difal',valor:val,dDisp:dDisp,dFmt:dFmt,mesano:mesano,ex:{nota:notaM?notaM[1]:''}});
      }
    });
  }
  var idx003=lines.findIndex(function(l){return/003\s*-\s*Estorno\s*de\s*Cr[eé]ditos/i.test(l);});
  if(idx003>=0){
    parseItemBlocks(lines,idx003+1,/^Total\s+Estornos\s+Cr[eé]ditos/i).forEach(function(b){
      var val=lastCurrencyInLine(b.text);
      if(isNaN(val)||val<=0)return;
      if(/CTE\s*-\s*Art\.\s*62/i.test(b.text)&&/benef/i.test(b.text)){
        lanc.push({tipo:'benef_fiscal',valor:val,dDisp:dDisp,dFmt:dFmt,mesano:mesano,ex:{}});
      } else if(/oper\.\s*interestadual/i.test(b.text)){
        lanc.push({tipo:'estorno_interestadual',valor:val,dDisp:dDisp,dFmt:dFmt,mesano:mesano,ex:{}});
      } else if(/oper\.\s*interna/i.test(b.text)){
        lanc.push({tipo:'estorno_interna',valor:val,dDisp:dDisp,dFmt:dFmt,mesano:mesano,ex:{}});
      }
    });
  }
  var idx006=lines.findIndex(function(l){return/006\s*-\s*Outros\s*Cr[eé]ditos/i.test(l);});
  if(idx006>=0){
    parseItemBlocks(lines,idx006+1,/^Total\s+Outros\s+Cr[eé]ditos/i).forEach(function(b){
      var val=lastCurrencyInLine(b.text);
      if(isNaN(val)||val<=0)return;
      if(/Cr\.\s*out\./i.test(b.text)){
        lanc.push({tipo:'cr_out_atacadista',valor:val,dDisp:dDisp,dFmt:dFmt,mesano:mesano,ex:{}});
      }
    });
  }
  var v013=valorNaLinha(lines,/013\s*-\s*Imposto\s*a\s*Recolher/i);
  if(isNaN(v013))v013=valorNaLinha(lines,/011\s*-\s*Saldo\s*Devedor/i);
  /* Créditos na apuração: com imposto a recolher (013 > 0) lança o 010 (total dos créditos);
     com saldo credor (014) ou saldo zerado lança o 004 (subtotal dos débitos). */
  var v004=valorNaLinha(lines,/004\s*-\s*SUB\s*-?\s*TOTAL/i),v010=valorNaLinha(lines,/010\s*-\s*TOTAL/i);
  var vCred=(!isNaN(v013)&&v013>0)?v010:v004;
  if(!isNaN(vCred)&&vCred>0)lanc.push({tipo:'outros_creditos',valor:vCred,dDisp:dDisp,dFmt:dFmt,mesano:mesano,ex:{mesano:mesano},origem:(!isNaN(v013)&&v013>0)?'010':'004'});
  if(!isNaN(v013)&&v013>0)lanc.push({tipo:'apuracao',valor:v013,dDisp:dDisp,dFmt:dFmt,mesano:mesano,ex:{mesano:mesano}});

  /* Demais itens discriminados (002/003/006/007/012) que a leitura fixa acima não usou:
     ficam guardados para casar com as regras cadastradas da empresa (ver itensAutoDoLivro). */
  var itens=itensDiscriminados(lines).filter(function(it){return !blocoJaLido(it.secao,it.texto);});
  var v014=valorNaLinha(lines,/014\s*-\s*Saldo\s*Credor/i);
  return {mesano:mesano,cnpj:extrairCnpj(joined),lancamentos:lanc,itens:itens,
    resumo:{v004:isNaN(v004)?null:v004,v010:isNaN(v010)?null:v010,v013:isNaN(v013)?null:v013,v014:isNaN(v014)?null:v014}};
}
/* Lê os itens de cada seção discriminada do livro, parando no campo seguinte (0xx - ...).
   Funciona com o livro da Domínio e com o do SAAM (onde o 002 vazio não tem linha de total). */
function itensDiscriminados(lines){
  var out=[],secRe=/^(0\d\d)\s*-\s*/,itemRe=/^(\d{1,3})\s*-\s*/;
  var alvo={'002':1,'003':1,'006':1,'007':1,'012':1},sec=null,cur=null;
  function fecha(){if(cur){var v=lastCurrencyInLine(cur.text);if(!isNaN(v)&&v>0)out.push({secao:cur.secao,texto:cur.text.replace(itemRe,'').replace(/\s*\d{1,3}(?:\.\d{3})*,\d{2}\s*$/,'').replace(/\s+/g,' ').trim(),valor:v});cur=null;}}
  lines.forEach(function(l){
    var t=String(l).trim(),ms=t.match(secRe);
    if(ms&&!/^0\d\d\s*-\s*\d/.test(t)){fecha();sec=alvo[ms[1]]?ms[1]:null;return;}
    if(!sec)return;
    if(/^Total\b/i.test(t)){fecha();return;}
    var mi=t.match(itemRe);
    if(mi){fecha();cur={secao:sec,text:t};}
    else if(cur)cur.text+=' '+t;
  });
  fecha();
  return out;
}
/* Mesmos critérios da leitura fixa, para não lançar o mesmo item duas vezes */
function blocoJaLido(secao,texto){
  if(secao==='002')return /diferen[cç]a\s+de\s+al[ií]quotas/i.test(texto);
  if(secao==='003')return (/CTE\s*-\s*Art\.\s*62/i.test(texto)&&/benef/i.test(texto))||/oper\.\s*interestadual/i.test(texto)||/oper\.\s*interna/i.test(texto);
  if(secao==='006')return /Cr\.\s*out\./i.test(texto);
  return false;
}
function normHist(s){
  return String(s||'').replace(/\{[^}]*\}/g,' ').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
/* Casa cada item do livro com a regra da empresa cujo histórico aparece no texto do item.
   Devolve {lancs:[...], semRegra:[...]} */
function itensAutoDoLivro(a,e){
  var res={lancs:[],semRegra:[]};if(!a.itens||!a.itens.length||!e)return res;
  var regras=getTipos(e).filter(function(t){
    return t.ativo&&t.deb&&t.cred&&PKEYS.indexOf(t.key)===-1&&t.key.indexOf('pcextra_')!==0&&t.key.charAt(0)!=='_'&&typeof t.hist==='string';
  }).map(function(t){var n=normHist(t.hist);return{t:t,n:n.slice(0,60)};}).filter(function(r){return r.n.length>=15;});
  var mm=parseInt(a.mesano.split('/')[0],10),yy=parseInt(a.mesano.split('/')[1],10);
  var dd=String(new Date(yy,mm,0).getDate()).padStart(2,'0'),ms=String(mm).padStart(2,'0');
  a.itens.forEach(function(it){
    var txt=normHist(it.texto),melhor=null;
    regras.forEach(function(r){if(txt.indexOf(r.n)>=0&&(!melhor||r.n.length>melhor.n.length))melhor=r;});
    if(!melhor){res.semRegra.push(it);return;}
    var nota=(it.texto.match(/Nota\s*N[oº°]?\.?:?\s*(\d+)/i)||[])[1]||'';
    res.lancs.push({tipo:melhor.t.key,valor:it.valor,dDisp:dd+'/'+ms+'/'+yy,dFmt:String(yy)+ms+dd,mesano:a.mesano,ex:{mesano:a.mesano,nota:nota},auto:true});
  });
  return res;
}

/* Placeholders por filial: {filialnome} = MATRIZ / FILIAL TO · {filialsigla} = MTZ / FL TO
   (matriz = CNPJ terminado em 0001; UF vem do cadastro da filial). Sem UF, usa o {filiallabel}. */
function filialPlaceholders(e,fil){
  var fs=e?getFiliais(e):[],f=null;fs.forEach(function(x){if(String(x.fil)===String(fil))f=x;});
  var lbl=filialLabel(fil);
  var matriz=f?/0001\d{2}$/.test(normCnpj(f.cnpj)):String(fil)==='1';
  if(matriz)return{filiallabel:lbl,filialnome:'MATRIZ',filialsigla:'MTZ'};
  var uf=f&&f.uf?String(f.uf).toUpperCase():'';
  return{filiallabel:lbl,filialnome:uf?'FILIAL '+uf:lbl,filialsigla:uf?'FL '+uf:lbl};
}
function resolveHist(tpl,ex){
  var h=String(tpl||'');
  if(ex)Object.keys(ex).forEach(function(k){h=h.split('{'+k+'}').join(ex[k]||'');});
  return h.replace(/\{[^}]+\}/g,'');
}

function getTipos(e){
  var mapa=e.mapeamento||{},out=[];
  PADRAO.forEach(function(t){var m=mapa[t.key]||{};out.push({key:t.key,label:m.label||t.label,hist:m.hist||t.hist,deb:m.deb||t.deb,cred:m.cred||t.cred,ativo:m.ativo!==false});});
  Object.keys(mapa).forEach(function(k){if(PKEYS.indexOf(k)===-1){var m=mapa[k];out.push({key:k,label:m.label||k,hist:m.hist||'',deb:m.deb||'',cred:m.cred||'',ativo:m.ativo!==false});}});
  return out;
}

/* ═══════ LANÇAMENTOS COM VALOR MANUAL (ex.: diferenças da 4E) ═══════
   Tipos com chave "manual_..." ficam com contas e histórico fixos no cadastro da empresa;
   o valor é digitado na prévia de cada PDF. Valor negativo inverte Débito/Crédito. */
function tiposManuais(e){
  return getTipos(e).filter(function(t){return t.key.indexOf('manual_')===0&&t.ativo;});
}
function parseValorManual(s){
  s=String(s||'').trim().replace(/\s/g,'').replace(/^R\$/i,'');
  if(!s)return NaN;
  if(s.indexOf(',')>=0)return parseValorBR(s);
  return parseFloat(s);
}
function fmtValorBR(v){
  var neg=v<0;v=Math.abs(v);
  var p=v.toFixed(2).split('.');
  return(neg?'-':'')+p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+p[1];
}
function setManual(id,key,val){
  var a=arquivos.filter(function(x){return x.id===id;})[0];if(!a)return;
  a.manuais=a.manuais||{};
  var v=parseValorManual(val);
  if(isNaN(v)||v===0)delete a.manuais[key];else a.manuais[key]=v;
  renderPreviewAll();
}
/* Lançamentos lidos do PDF + os digitados manualmente para este arquivo */
function lancsComManuais(a,e){
  var out=(a.lancamentos||[]).slice();
  if(a.mesano)out=out.concat(itensAutoDoLivro(a,e).lancs);
  if(!a.manuais||!a.mesano)return out;
  var mm=parseInt(a.mesano.split('/')[0],10),yy=parseInt(a.mesano.split('/')[1],10);
  var ld=new Date(yy,mm,0).getDate();
  var dd=String(ld).padStart(2,'0'),ms=String(mm).padStart(2,'0');
  var ativos={};tiposManuais(e).forEach(function(t){ativos[t.key]=true;});
  Object.keys(a.manuais).forEach(function(k){
    var v=a.manuais[k];if(!ativos[k]||isNaN(v)||!v)return;
    out.push({tipo:k,valor:Math.abs(v),inverter:v<0,dDisp:dd+'/'+ms+'/'+yy,dFmt:String(yy)+ms+dd,mesano:a.mesano,ex:{mesano:a.mesano},manual:true});
  });
  return out;
}
/* Resumo do que foi lido do livro: itens sem regra cadastrada e saldo do período */
function blocoLivro(a,e){
  if(a.manualOnly)return'';
  var html='',auto=itensAutoDoLivro(a,e);
  var NOMES={'002':'Outros débitos','003':'Estorno de créditos','006':'Outros créditos','007':'Estorno de débitos','012':'Deduções'};
  if(auto.lancs.length)html+='<div class="alert alert-ok" style="margin-top:8px"><i class="ti ti-check"></i><span>'+auto.lancs.length+' item(ns) discriminado(s) no livro casaram com regras da empresa e já estão na prévia.</span></div>';
  if(auto.semRegra.length)html+='<div class="alert alert-info" style="margin-top:8px;flex-direction:column;align-items:flex-start;gap:4px"><div><i class="ti ti-info-circle"></i> Itens do livro <strong>sem regra cadastrada</strong> (não lançados):</div>'+
    auto.semRegra.map(function(it){return'<div style="font-size:11px">'+esc(it.secao)+' · '+esc(NOMES[it.secao]||'')+' — '+esc(it.texto.slice(0,110))+' — <strong>R$ '+fmtValorBR(it.valor)+'</strong></div>';}).join('')+
    '<div style="font-size:11px">Para lançar sozinho nos próximos meses, cadastre em Empresas um tipo com esse histórico.</div></div>';
  var r=a.resumo||{};
  if(r.v013!==null&&r.v013!==undefined||r.v014)html+='<div style="font-size:11px;color:#5F5E5A;margin-top:6px">Livro: 004 Subtotal débitos <strong>R$ '+fmtValorBR(r.v004||0)+'</strong> · 010 Total créditos <strong>R$ '+fmtValorBR(r.v010||0)+'</strong> · 013 Imposto a recolher <strong>R$ '+fmtValorBR(r.v013||0)+'</strong>'+(r.v014?' · 014 Saldo credor <strong>R$ '+fmtValorBR(r.v014)+'</strong>':'')+
    '<br>Créditos na apuração: '+((r.v013||0)>0?'há imposto a recolher, usa o <strong>010</strong>':'há saldo credor ou saldo zero, usa o <strong>004</strong>')+'.</div>';
  return html;
}
function blocoManuais(a,e){
  var ts=tiposManuais(e);if(!ts.length)return'';
  var autoPorTipo={};if(a.mesano)itensAutoDoLivro(a,e).lancs.forEach(function(l){autoPorTipo[l.tipo]=(autoPorTipo[l.tipo]||0)+l.valor;});

          '<div class="tipo-contas">D: '+esc(t.deb||'—')+' / C: '+esc(t.cred||'—')+(falta?' <span style="color:#A32D2D">(conta em branco)</span>':'')+
          (lidos?' <span style="color:#00682F;font-weight:500">· lido do PDF: '+fmtValorBR(lidos)+' (já incluído; só digite se houver valor a mais)</span>':'')+'</div></div>'+
        '<input type="text" inputmode="decimal" placeholder="0,00" value="'+(v?fmtValorBR(v):'')+'" '+

      '</div>';
    }).join('')+

  '</div>';
}


/* ═══ Winthor TXT (layout C3 PC Sistemas, largura fixa 279, CRLF) ═══ */
function txtAscii(s){
  return String(s===null||s===undefined?'':s).replace(/\r?\n/g,' ').toUpperCase()
    .replace(/§/g,'S').replace(/º/g,'o').replace(/ª/g,'a').replace(/°/g,'o')
    .normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7E]/g,' ');
}
function padE(v,n){var s=String(v===null||v===undefined?'':v);return s.length>=n?s.slice(s.length-n):' '.repeat(n-s.length)+s;}
function padD(v,n){var s=String(v===null||v===undefined?'':v);return s.length>=n?s.slice(0,n):s+' '.repeat(n-s.length);}
function linhaTxtC3(r){
  /* r = ['C3',num,conta,DDMMAAAA,'D'|'C',doc,valor22,codH,hist,'N',_,filial] (mesmo array do XLSX) */
  return 'C3'+String(r[1]).padStart(10,'0')+padE(r[2],12)+String(r[3])+r[4]+padE(r[5]?r[5]:'',15)+
    String(r[6])+padE(r[7],4)+padD(txtAscii(r[8]),200)+(r[9]||'N')+'0'+padE(r[11],2)+' ';
}
function winRowsParaTxt(rows,cab){
  var linhas=[padD(String(cab||''),14)].concat(rows.map(linhaTxtC3));
  return linhas.join('\r\n')+'\r\n';
}
/* Cabeçalho (1ª linha) do TXT — cadastro da empresa; padrão igual ao arquivo de referência da 4E */
var TXT_CAB_PADRAO='0001641';
function txtCab(e){var c=e&&e.mapeamento&&e.mapeamento.txt_cab;return String(c||TXT_CAB_PADRAO).trim();}
/* Formato do arquivo Winthor (XLSX ou TXT), escolhido nas abas e lembrado neste navegador */
var FMT_KEY='apur_fmt_win';
function formatoWin(){try{return localStorage.getItem(FMT_KEY)==='txt'?'txt':'xlsx';}catch(e){return'xlsx';}}
function setFormatoWin(v){try{localStorage.setItem(FMT_KEY,v==='txt'?'txt':'xlsx');}catch(e){}
  document.querySelectorAll('.fmt-win').forEach(function(sel){sel.value=formatoWin();});}
function seletorFormato(ctx){
  var f=formatoWin();
  return '<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end;margin:.25rem 0 .4rem;font-size:12px;color:#5F5E5A">'+
    '<label for="fmt-win-'+ctx+'">Arquivo Winthor (rotina 2127):</label>'+
    '<select id="fmt-win-'+ctx+'" class="fmt-win" onchange="setFormatoWin(this.value)" style="height:30px;border:0.5px solid #D3D1C7;border-radius:8px;padding:0 8px;font-size:12px">'+
      '<option value="xlsx"'+(f==='xlsx'?' selected':'')+'>Excel (.xlsx)</option><option value="txt"'+(f==='txt'?' selected':'')+'>Texto (.txt)</option></select></div>';
}
/* Salva as linhas Winthor no formato escolhido. Em TXT sai um arquivo por empresa (cada uma com o seu cabeçalho). */
function salvarWinthor(prefixo,aba,my,grupos){
  var ks=Object.keys(grupos).filter(function(k){return grupos[k].length;});if(!ks.length)return 0;
  if(formatoWin()==='txt'){
    ks.forEach(function(k){
      var e=db.empresas[k];
      saveFile(prefixo+'_WINTHOR_'+normCnpj((e&&e.cnpj)||k)+'_'+my+'.txt',winRowsParaTxt(grupos[k],txtCab(e)));
    });
    return ks.length;
  }
  var rows=[];ks.forEach(function(k){rows=rows.concat(grupos[k]);});
  var wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:6},{wch:8},{wch:12},{wch:10},{wch:10},{wch:12},{wch:24},{wch:7},{wch:55},{wch:11},{wch:3},{wch:7}];
  XLSX.utils.book_append_sheet(wb,ws,aba);
  saveXlsx(wb,prefixo+'_WINTHOR_'+my+'.xlsx');return 1;
}

function _limparArquivos(ctx){
  var c=CTX_ARQ[ctx];c.set([]);

function substituirArquivo(ctx,id,input){
  var f=input.files&&input.files[0];input.value='';if(!f)return;
  var c=CTX_ARQ[ctx],antigo=c.lista().filter(function(x){return x.id===id;})[0];if(!antigo)return;
  c.ler(f).then(function(novos){
    var lista=c.lista(),i=lista.indexOf(antigo);if(i<0)return;
    novos.forEach(function(r,j){
      r.id=j===0?id:id+'_'+j;
      /* mantém valores digitados e a empresa/filial escolhidas, se o novo arquivo for da mesma empresa */
      if(!r.erro&&!r.empresaKey&&antigo.empresaKey){r.empresaKey=antigo.empresaKey;r.filial=antigo.filial;}
      if(antigo.manuais&&r.empresaKey===antigo.empresaKey)r.manuais=antigo.manuais;
    });
    lista.splice.apply(lista,[i,1].concat(novos));
    c.render();
  });
}

/* Valores lidos da planilha que o usuário corrigiu na prévia (Winthor: 4E, Safra...).
   a.editados[índice] = novo valor; 0 tira a linha; negativo inverte Débito/Crédito. */
function pcEditavel(e){return!!e&&e.sistema==='winthor';}
function setEditadoPC(id,idx,val){
  var a=arquivosPC.filter(function(x){return x.id===id;})[0];if(!a)return;
  a.editados=a.editados||{};
  var s=String(val||'').trim(),orig=((a.lancamentos||[])[idx]||{}).valor;

  var v=parseValorManual(s);

  v=Math.round(v*100)/100;

function restaurarEditadosPC(id){

/* Marca como duplicado qualquer PDF carregado que tenha o mesmo CNPJ + mesma competência (mês/ano)
   de outro já carregado antes dele. Mantém o primeiro como "válido" e os demais como duplicata,
   para que a mesma apuração não seja somada/gerada mais de uma vez por engano. */
function marcarDuplicados(){
  var vistos={};
  arquivos.forEach(function(a){
    if(a.erro||a.manualOnly){a.duplicado=false;return;}
    var chave=normCnpj(a.cnpj)+'|'+(a.mesano||'');
    if(chave==='|'){a.duplicado=false;return;}
    if(vistos[chave]){a.duplicado=true;a.duplicadoDeNome=vistos[chave].nome;a.duplicadoDeId=vistos[chave].id;}
    else{a.duplicado=false;vistos[chave]=a;}
  });
}

function linhasDomFor(lancs,e,tipos,filOverride){
  var out=[],lote=1,tm={};
  (tipos||getTipos(e)).forEach(function(t){tm[t.key]=t;});
  var fs=getFiliais(e);
  var fil=filOverride||(fs[0]&&fs[0].fil)||'1';
  var fl=filialLabel(fil);
  lancs.forEach(function(l){
    var t=tm[l.tipo];if(!t||!t.ativo||!t.deb||!t.cred)return;
    var ex2=Object.assign({},l.ex,filialPlaceholders(e,fil));
    out.push({dDisp:l.dDisp,dFmt:l.dFmt,deb:l.inverter?t.cred:t.deb,cred:l.inverter?t.deb:t.cred,val:l.valor,lote:lote,hist:resolveHist(t.hist,ex2)});lote++;
  });
  return out;
}
function fvw(v){var s=v.toFixed(2).replace('.',',');return s.padStart(22,'0').replace(',','.');}
function winNum(v){var t=String(v===null||v===undefined?'':v).trim();return /^\d+$/.test(t)?parseInt(t,10):t;}
function linhasWinFor(lancs,e,tipos,filOverride){
  var mapa=e.mapeamento||{},codH=mapa.cod_h||'37';
  var fs=getFiliais(e);
  var fil=filOverride||(fs[0]&&fs[0].fil)||'1';
  var fl=filialLabel(fil);
  var tm={};(tipos||getTipos(e)).forEach(function(t){tm[t.key]=t;});
  var out=[],num=1;
  lancs.forEach(function(l){
    var t=tm[l.tipo];if(!t||!t.ativo||!t.deb||!t.cred)return;
    var ex2=Object.assign({},l.ex,filialPlaceholders(e,fil));
    var vf=fvw(l.valor),hist=resolveHist(t.hist,ex2);
    /* layout aceito pelo Winthor (conferido com importação real): data DDMMAAAA em texto,
       conta/cod. histórico/filial/doc como número, DOC vazio quando não há nota, coluna 11 vazia */
    var dWin=String(l.dDisp||'').replace(/\//g,'');
    var doc=(l.ex&&l.ex.nota)?winNum(l.ex.nota):null;
    var deb=winNum(l.inverter?t.cred:t.deb),cred=winNum(l.inverter?t.deb:t.cred);
    out.push(['C3',1,deb,dWin,'D',doc,vf,winNum(codH),hist,'N',null,winNum(fil)]);
    out.push(['C3',2,cred,dWin,'C',doc,vf,winNum(codH),hist,'N',null,winNum(fil)]);num++;
  });
  return out;
}

function gerarArquivo(){
  marcarDuplicados();
  var mesano='';arquivos.forEach(function(a){if(!mesano&&a.mesano)mesano=a.mesano;});
  var my=mesano?mesano.replace('/','_'):'export';
  var winGrupos={},domGroups={},pendentes=0,duplicados=0;
  arquivos.forEach(function(a){
    if(a.erro)return;
    if(a.duplicado){duplicados++;return;}
    if(!a.empresaKey||!db.empresas[a.empresaKey]){pendentes++;return;}
    var e=db.empresas[a.empresaKey],tipos=getTipos(e),fs=getFiliais(e);
    var fil=a.filial||(fs.length===1?fs[0].fil:null);
    if(!fil){pendentes++;return;} /* empresa com múltiplas filiais e nenhuma escolhida ainda */
    if(e.sistema==='winthor'){

/* Identifica a que "tipo" (linha do resumo) uma descrição corresponde, tolerando maiúsc./acentos */
function detectarBasePisCofins(descNorm){
  if(/DEVOLUCAO DE VENDAS/.test(descNorm))return'devolucao_vendas';
  if(/DEVOLUCAO DE COMPRAS/.test(descNorm))return'devolucao_compras';
  if(/PRESTACAO DE SERVICO/.test(descNorm))return'prestacao_servico';
  if(/ESTORNOS? DE CREDITOS? BAIXA DE ESTOQUE/.test(descNorm))return'estorno_creditos_estoque';
  if(/RECEITA FINANCEIRA/.test(descNorm))return'receita_financeira';
  if(/CREDITO OUTORGADO/.test(descNorm))return'credito_outorgado';
  if(/ENTRADA DE BONIFICACAO/.test(descNorm))return'entrada_bonificacao';
  if(/COMPRAS PARA COMERCIALIZACAO/.test(descNorm))return'compras_comercializacao';
  if(/INDUSTRIALIZACAO POR ENCOMENDA/.test(descNorm))return'industrializacao_encomenda';
  if(/AQUISICAO DE SERVICO DE TRANSPORTE/.test(descNorm))return'aquisicao_transporte';
  if(/ENERGIA ELETRICA/.test(descNorm))return'energia_eletrica';
  if(/ALUGUEL IMOVEL/.test(descNorm))return'aluguel_imovel';
  if(/^VENDAS/.test(descNorm))return'vendas';
  return null;
}
function readOneXlsxPC(file){
  return new Promise(function(resolve){
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        var sheetName=wb.SheetNames.find(function(n){return!/aliquota\s*zero/i.test(n);})||wb.SheetNames[0];
        var ws=wb.Sheets[sheetName];
        var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
        var cnpj='',mesano='',colPis=-1,colCofins=-1;
        rows.forEach(function(row){
          (row||[]).forEach(function(cell,ci){
            var s=String(cell===null||cell===undefined?'':cell);
            if(!cnpj&&/CNPJ:/i.test(s))cnpj=extrairCnpj(s);
            if(!mesano){var mm=s.match(/Per[ií]odo:\s*(\d{2})[-\/](\d{4})/i);if(mm)mesano=mm[1]+'/'+mm[2];}
            var h=normHeader(s);
            if(colPis<0&&/^(DEBITO|CREDITO) PIS$/.test(h))colPis=ci;
            if(colCofins<0&&/^(DEBITO|CREDITO) COFINS$/.test(h))colCofins=ci;
          });
        });
        if(!mesano){resolve({nome:file.name,erro:'Não encontrei o "Período" na planilha.'});return;}
        if(colPis<0||colCofins<0){resolve({nome:file.name,erro:'Não encontrei as colunas de Débito/Crédito PIS e COFINS na planilha.'});return;}
        var mm=parseInt(mesano.split('/')[0],10),yy=parseInt(mesano.split('/')[1],10);
        var ld=new Date(yy,mm,0).getDate();
        var dDisp=String(ld).padStart(2,'0')+'/'+String(mm).padStart(2,'0')+'/'+yy;
        var lancamentos=[];
        rows.forEach(function(row){
          if(!row||row[1]===null||row[1]===undefined||row[1]==='')return;
          var descNorm=normHeader(row[1]);
          var base=detectarBasePisCofins(descNorm);if(!base)return;
          var vPis=parseFloat(row[colPis]),vCofins=parseFloat(row[colCofins]);
          if(!isNaN(vPis)&&vPis!==0)lancamentos.push({tipo:'pis_'+base,valor:vPis,dDisp:dDisp,ex:{mesano:mesano}});
          if(!isNaN(vCofins)&&vCofins!==0)lancamentos.push({tipo:'cofins_'+base,valor:vCofins,dDisp:dDisp,ex:{mesano:mesano}});
        });
        var match=matchEmpresaByCnpj(cnpj);
        resolve({nome:file.name,mesano:mesano,cnpj:cnpj,lancamentos:lancamentos,empresaKey:match?match.key:null,filial:match?match.fil:null});
      }catch(err){resolve({nome:file.name,erro:err.message});}
    };
    reader.readAsArrayBuffer(file);
  });
}
function loadXlsxPC(fileList){
  var files=Array.prototype.slice.call(fileList).filter(function(f){return/\.xlsx$|\.xls$/i.test(f.name);});
  if(!files.length)return;
  var dn=document.getElementById('drop-name-pc');if(dn){dn.style.display='block';dn.textContent='Lendo '+files.length+' planilha(s)...';}
  Promise.all(files.map(readOneXlsxPC)).then(function(results){
    results.forEach(function(r){r.id='p'+Date.now()+Math.random().toString(36).slice(2,7);arquivosPC.push(r);});
    var d=document.getElementById('drop-pc');if(d)d.classList.add('done');
    if(dn)dn.textContent=arquivosPC.length+' planilha(s) carregada(s)';
    renderPreviewPC();
  });
}

/* Pura: linhas do PDF → {empresa,cnpj,ordem:[MM/AAAA],comp:{MM/AAAA:[{g,nome,dep}]}} */
function parseResumoDepreciacao(lines){
  var NUM='-?\\d{1,3}(?:\\.\\d{3})*,\\d{2}';
  var ROW=new RegExp('^(\\d{1,4})\\s+(.+?)\\s+((?:'+NUM+'\\s*){3,})$');
  var res={empresa:'',cnpj:'',ordem:[],comp:{}},cur=null;
  function ensure(c){if(!res.comp[c]){res.comp[c]=[];res.ordem.push(c);}}
  lines.forEach(function(raw,idx){
    var l=String(raw).replace(/\s+/g,' ').replace(/(\d)\s+,(\d{2})\b/g,'$1,$2').trim();
    if(!res.empresa&&l&&!/^P[áa]gina/i.test(l))res.empresa=l.replace(/\s*P[áa]gina:.*$/i,'').trim();
    var cn=l.match(/C\.?N\.?P\.?J\.?:?\s*([\d.\/-]{14,18})/i);
    if(cn&&!res.cnpj)res.cnpj=cn[1];
    var m=l.match(/Compet[êe]ncia:?\s*\d{2}\/(\d{2})\/(\d{4})/i);
    if(m){cur=m[1]+'/'+m[2];ensure(cur);return;}
    m=l.match(/Compet[êe]ncia:?\s*(\d{2})\/(\d{4})/i);
    if(m&&!cur){cur=m[1]+'/'+m[2];ensure(cur);return;}
    var r=l.match(ROW);
    if(r&&cur){
      var nums=r[3].trim().split(/\s+/).map(function(s){var neg=s.charAt(0)==='-';var v=parseValorBR(s.replace(/^-/,''));return neg?-v:v;});
      res.comp[cur].push({g:String(+r[1]),nome:r[2].trim(),dep:nums[2]});
    }
  });
  res.ordem=res.ordem.filter(function(c){return res.comp[c].length;});
  return res;
}

function readOnePdfDP(file){
  return new Promise(function(resolve){
    var reader=new FileReader();
    reader.onload=function(ev){
      pdfjsLib.getDocument({data:new Uint8Array(ev.target.result)}).promise.then(function(pdf){
        var arr=[];for(var i=1;i<=pdf.numPages;i++)arr.push(pdf.getPage(i));
        return Promise.all(arr).then(function(pl){return Promise.all(pl.map(function(p){return p.getTextContent();}));})
        .then(function(cs){
          var lines=[];cs.forEach(function(c){lines=lines.concat(linesFromContent(c));});
          var p=parseResumoDepreciacao(lines);
          if(!p.ordem.length){resolve([{nome:file.name,erro:'Não encontrei as linhas do Resumo da Depreciação Fiscal neste PDF. Confira se é o relatório "Resumo da Depreciação Fiscal por Conta Patrimonial" da Domínio, gerado com texto (não escaneado).'}]);return;}
          var match=matchEmpresaByCnpj(p.cnpj);
          resolve(p.ordem.map(function(c){
            return{nome:file.name,cnpj:p.cnpj,empresaPdf:p.empresa,mesano:c,grupos:p.comp[c],multi:p.ordem.length,empresaKey:match?match.key:null,filial:match?match.fil:null};
          }));
        });
      }).catch(function(err){resolve([{nome:file.name,erro:err.message}]);});
    };
    reader.readAsArrayBuffer(file);
  });
}
function loadPdfsDP(fileList){
  var files=Array.prototype.slice.call(fileList).filter(function(f){return/\.pdf$/i.test(f.name);});
  if(!files.length)return;
  var dn=document.getElementById('drop-name-dp');if(dn){dn.style.display='block';dn.textContent='Lendo '+files.length+' PDF(s)...';}
  Promise.all(files.map(readOnePdfDP)).then(function(results){
    results.forEach(function(lista){lista.forEach(function(r){r.id='d'+Date.now()+Math.random().toString(36).slice(2,7);arquivosDP.push(r);});});
    var d=document.getElementById('drop-dp');if(d)d.classList.add('done');
    if(dn)dn.textContent=arquivosDP.length+' competência(s) carregada(s)';
    renderPreviewDP();
  });
}

/* Resolve empresa/config/filial de um arquivo carregado */
function ctxDP(a){
  var e=a.empresaKey?db.empresas[a.empresaKey]:null;

  var fs=e?getFiliais(e):[];

  return{e:e,depr:depr,fs:fs,fil:fil,nome:e?e.nome:(a.empresaPdf||'')};
}
function _numOuTexto(v){var s=String(v===undefined||v===null?'':v).trim();return/^\d+$/.test(s)?parseInt(s,10):s;}
/* Monta as linhas Winthor (A–L) + avisos de um arquivo */
function linhasDepr(a,depr,fil){
  var mm=parseInt(a.mesano.split('/')[0],10),yy=parseInt(a.mesano.split('/')[1],10);
  var ld=new Date(yy,mm,0).getDate();
  var dFmt=String(ld).padStart(2,'0')+String(mm).padStart(2,'0')+yy;
  var codH=_numOuTexto(depr.cod_h||'1');
  var rows=[],notes=[],usados={},porG={};
  a.grupos.forEach(function(g){porG[g.g]=g;});
  function nn(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();}
  (depr.grupos||[]).forEach(function(c){
    var g=porG[String(+c.g)];
    if(!g){notes.push({k:'warn',t:'Grupo '+c.g+' ('+c.nome+') não aparece no PDF; ficou de fora.'});return;}
    usados[g.g]=true;
    if(nn(g.nome)!==nn(c.nome))notes.push({k:'warn',t:'Grupo '+c.g+': no PDF o nome é "'+g.nome+'" e no cadastro é "'+c.nome+'". Confira se é o mesmo grupo.'});
    if(!c.d||!c.c){notes.push({k:'err',t:'Grupo '+c.g+' ('+c.nome+') está sem conta débito ou crédito no cadastro.'});return;}
    if(!g.dep){notes.push({k:'warn',t:'Grupo '+c.g+' ('+c.nome+') com depreciação zero no mês; não gerei lançamento.'});return;}
    var hist=DEPR_HIST.replace('{grupo}',c.nome).replace('{mesano}',a.mesano);
    var vf=fvw(g.dep);
    /* mesmo formato aceito pelo Winthor nos lançamentos de ICMS: DOC e coluna 11 vazios */
    rows.push(['C3',_numOuTexto(c.nd||1),_numOuTexto(c.d),dFmt,'D',null,vf,codH,hist,'N',null,_numOuTexto(fil)]);
    rows.push(['C3',_numOuTexto(c.nc||2),_numOuTexto(c.c),dFmt,'C',null,vf,codH,hist,'N',null,_numOuTexto(fil)]);
  });
  a.grupos.forEach(function(g){if(!usados[g.g])notes.push({k:'err',t:'Grupo '+g.g+' ('+g.nome+') está no PDF com R$ '+g.dep.toFixed(2).replace('.',',')+', mas não tem conta cadastrada. Inclua em Empresas → Mapeamento Depreciação.'});});
  var totPdf=a.grupos.reduce(function(s,g){return s+(g.dep||0);},0);
  var totD=rows.filter(function(r){return r[4]==='D';}).reduce(function(s,r){return s+parseFloat(r[6]);},0);
  return{rows:rows,notes:notes,totPdf:totPdf,totD:totD};
}
function _fmtBR(v){return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}

    } else if(x.depr){

    } else {
      empBlock='<div class="alert alert-warn" style="margin-top:8px"><i class="ti ti-alert-triangle"></i><span>Não identifiquei a empresa pelo CNPJ ou ela não tem Mapeamento Depreciação. Selecione a empresa (o mapeamento é configurado em Empresas):</span></div>'+
        '<select onchange="setArquivoEmpresaDP(\''+a.id+'\',this.value)" style="margin-top:4px"><option value="">— selecione a empresa —</option>'+

    } else if(x.depr&&x.fil){

function gerarArquivoDP(){
  marcarDuplicadosDP();
  var gerou=0,pendentes=0,dup=0;
  arquivosDP.forEach(function(a){
    if(a.erro)return;
    if(a.duplicado){dup++;return;}
    var x=ctxDP(a);
    if(!x.depr||!x.fil){pendentes++;return;}
    var L=linhasDepr(a,x.depr,x.fil);if(!L.rows.length)return;
    var my=a.mesano.replace('/','_');
    if(formatoWin()==='txt'){saveFile('DEPRECIACAO_WINTHOR_'+normCnpj(a.cnpj)+'_'+my+'.txt',winRowsParaTxt(L.rows,txtCab(x.e)));gerou++;return;}
    var ws=XLSX.utils.aoa_to_sheet(L.rows);
    ws['!cols']=[{wch:5},{wch:8},{wch:11},{wch:10},{wch:10},{wch:5},{wch:24},{wch:7},{wch:70},{wch:11},{wch:3},{wch:7}];
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'DEPRECIACAO');
    saveXlsx(wb,'DEPRECIACAO_WINTHOR_'+normCnpj(a.cnpj)+'_'+my+'.xlsx');gerou++;
  });
  var el=document.getElementById('apur-st-dp');
  function st(m,t){if(el){el.textContent=m;el.className='status-msg'+(t?' '+t:'');}}
  if(!gerou){st(pendentes?'Identifique a empresa/filial de todos os PDFs antes de gerar.':(dup?'Todos os PDFs carregados são duplicados.':'Nenhuma linha gerada.'),'err');return;}
  st(gerou+' arquivo(s) gerado(s)'+(pendentes?' — '+pendentes+' sem empresa/filial foram ignorados':'')+(dup?' — '+dup+' duplicado(s) ignorado(s)':'')+'.',(pendentes||dup)?'warn':'ok');
}

   Cada empresa guarda as últimas 50 alterações (quem, quando, o que mudou).

function quemAgora(){return{login:ME.login||'',nome:ME.nome||ME.login||'Modo local',em:new Date().toISOString()};}
function fmtDataHora(iso){
  var d=new Date(iso);if(isNaN(d))return'';
  function z(n){return String(n).padStart(2,'0');}
  return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes());
}
function diffEmpresa(a,b){
  var out=[];if(!a)return out;
  if((a.nome||'')!==(b.nome||''))out.push('Nome: "'+(a.nome||'')+'" → "'+(b.nome||'')+'"');
  if((a.sistema||'')!==(b.sistema||''))out.push('Sistema: '+(a.sistema||'—')+' → '+(b.sistema||'—'));
  var fa=getFiliais(a).map(function(f){return f.cnpj+' (FIL '+f.fil+')';}),fb=getFiliais(b).map(function(f){return f.cnpj+' (FIL '+f.fil+')';});
  fb.forEach(function(f){if(fa.indexOf(f)<0)out.push('Filial incluída: '+f);});
  fa.forEach(function(f){if(fb.indexOf(f)<0)out.push('Filial removida: '+f);});
  var ma=a.mapeamento||{},mb=b.mapeamento||{};
  if((ma.cod_h||'')!==(mb.cod_h||''))out.push('Código de histórico: '+(ma.cod_h||'—')+' → '+(mb.cod_h||'—'));
  var keys={};Object.keys(ma).concat(Object.keys(mb)).forEach(function(k){if(k!=='cod_h')keys[k]=true;});
  Object.keys(keys).forEach(function(k){
    var x=ma[k],y=mb[k];
    var rot=(y&&y.label)||(x&&x.label)||k;
    if(x&&!y){out.push(rot+': removido');return;}
    if(!x&&y){if(y.deb||y.cred)out.push(rot+': incluído (D '+(y.deb||'—')+' / C '+(y.cred||'—')+')');return;}
    if((x.deb||'')!==(y.deb||''))out.push(rot+': débito '+(x.deb||'—')+' → '+(y.deb||'—'));
    if((x.cred||'')!==(y.cred||''))out.push(rot+': crédito '+(x.cred||'—')+' → '+(y.cred||'—'));
    if((x.hist||'')!==(y.hist||''))out.push(rot+': histórico alterado');
    if((x.ativo!==false)!==(y.ativo!==false))out.push(rot+': '+(y.ativo!==false?'ativado':'desativado'));
    if((x.label||'')!==(y.label||'')&&x.label&&y.label)out.push('Rótulo "'+x.label+'" → "'+y.label+'"');
  });
  return out;
}
function comRegistro(antes,novo,acao){
  var q=quemAgora();
  var mud=acao==='alterou'?diffEmpresa(antes,novo):[];
  var hist=((antes&&antes.historico)||[]).slice();
  hist.push({login:q.login,nome:q.nome,em:q.em,acao:acao,mudancas:mud.slice(0,40)});
  novo.historico=hist.slice(-50);
  novo.alterado={login:q.login,nome:q.nome,em:q.em};
  return novo;
}

  var html='<div id="tipos-lista-man">';
  Object.keys(mapa).forEach(function(k){if(k.indexOf('manual_')===0){var m=mapa[k];html+=tipoCard(k,m.label||k,m.hist||'',m.deb||'',m.cred||'',m.ativo!==false);}});
  return html+'</div><button class="btn btn-secondary btn-sm" style="margin-top:.5rem" onclick="addTipoManual()"><i class="ti ti-plus"></i> Adicionar lançamento manual</button>';
}
function addTipoManual(){var l=document.getElementById('tipos-lista-man');if(!l)return;var div=document.createElement('div');div.innerHTML=tipoCard('manual_'+Date.now(),'Diferença','DIFERENÇA ICMS {filiallabel} - COMPT. {mesano}','','',true);l.appendChild(div.firstChild);var c=l.lastChild;if(c){var b=c.querySelector('.tipo-body');if(b)b.classList.add('open');}}

function buildMapaPC(mapa){
  var html='<div id="tipos-lista-pc">';
  PADRAO_PC.forEach(function(t){var m=mapa[t.key]||{};html+=tipoCard(t.key,m.label||t.label,m.hist||t.hist,m.deb||t.deb,m.cred||t.cred,m.ativo!==false&&(m.ativo!==undefined?m.ativo:t.ativo));});
  Object.keys(mapa).forEach(function(k){if(k.indexOf('pcextra_')===0){var m=mapa[k];html+=tipoCard(k,m.label||k,m.hist||'',m.deb||'',m.cred||'',m.ativo!==false);}});
  return html+'</div><button class="btn btn-secondary btn-sm" style="margin-top:.5rem" onclick="addTipoExtraPC()"><i class="ti ti-plus"></i> Adicionar tipo extra</button>';
}
function addTipoExtraPC(){var l=document.getElementById('tipos-lista-pc');if(!l)return;var div=document.createElement('div');div.innerHTML=tipoCard('pcextra_'+Date.now(),'Novo tipo','','','',true);l.appendChild(div.firstChild);}
function buildCodH(mapa){
  return '<div class="grid2" style="max-width:460px"><div class="field"><label for="wt-codh">Código de Histórico</label><input type="text" id="wt-codh" value="'+esc(mapa.cod_h||'')+'" placeholder="ex: 24"></div>'+
    '<div class="field"><label for="wt-txtcab">Cabeçalho do TXT Winthor <span style="font-weight:300;color:#aaa;font-size:11px">(1ª linha)</span></label><input type="text" id="wt-txtcab" maxlength="14" value="'+esc(mapa.txt_cab||'')+'" placeholder="'+TXT_CAB_PADRAO+'"></div></div>'+
    '<div class="alert alert-info" style="margin-bottom:8px"><i class="ti ti-info-circle"></i><span>Mesmo código de histórico usado em todos os lançamentos desta empresa (Domínio ou Winthor). As contas débito/crédito de cada tipo de lançamento são configuradas abaixo, por tipo.</span></div>';
}
function salvarEmp(k){
  var nome=(document.getElementById('ef-nome').value||'').trim();
  var sis=(document.getElementById('ef-sis')||{}).value||'dominio';
  var st=document.getElementById('ef-st');
  var filiais=[];
  document.querySelectorAll('#ef-filiais-list .filial-row').forEach(function(row){
    var cnpjV=((row.querySelector('.ef-fil-cnpj')||{}).value||'').trim();
    var filV=((row.querySelector('.ef-fil-fil')||{}).value||'').trim();
    var ufV=((row.querySelector('.ef-fil-uf')||{}).value||'').trim().toUpperCase();
    if(cnpjV)filiais.push(ufV?{cnpj:cnpjV,fil:filV||'1',uf:ufV}:{cnpj:cnpjV,fil:filV||'1'});
  });
  if(!nome||!filiais.length){st.textContent='Preencha o nome e ao menos uma filial (CNPJ).';st.className='status-msg err';return;}
  var cnpjsNorm=filiais.map(function(f){return normCnpj(f.cnpj);});
  var repetido=cnpjsNorm.some(function(c,i){return c&&cnpjsNorm.indexOf(c)!==i;});
  if(repetido){st.textContent='Há CNPJs repetidos na lista de filiais.';st.className='status-msg err';return;}
  var mapa={};
  document.querySelectorAll('#tipos-lista .tipo-card').forEach(function(card){
    var key=card.getAttribute('data-key');if(!key)return;
    var id=card.id.replace('tcard-','');
    mapa[key]={label:(document.getElementById('tc-lbl-'+id)||{}).value||key,hist:(document.getElementById('tc-hist-'+id)||{}).value||'',deb:(document.getElementById('tc-deb-'+id)||{}).value||'',cred:(document.getElementById('tc-cred-'+id)||{}).value||'',ativo:!!(document.getElementById('tc-ativo-'+id)||{}).checked};
  });
  document.querySelectorAll('#tipos-lista-man .tipo-card').forEach(function(card){
    var key=card.getAttribute('data-key');if(!key)return;
    var id=card.id.replace('tcard-','');
    mapa[key]={label:(document.getElementById('tc-lbl-'+id)||{}).value||key,hist:(document.getElementById('tc-hist-'+id)||{}).value||'',deb:(document.getElementById('tc-deb-'+id)||{}).value||'',cred:(document.getElementById('tc-cred-'+id)||{}).value||'',ativo:!!(document.getElementById('tc-ativo-'+id)||{}).checked};
  });
  document.querySelectorAll('#tipos-lista-pc .tipo-card').forEach(function(card){
    var key=card.getAttribute('data-key');if(!key)return;
    var id=card.id.replace('tcard-','');
    mapa[key]={label:(document.getElementById('tc-lbl-'+id)||{}).value||key,hist:(document.getElementById('tc-hist-'+id)||{}).value||'',deb:(document.getElementById('tc-deb-'+id)||{}).value||'',cred:(document.getElementById('tc-cred-'+id)||{}).value||'',ativo:!!(document.getElementById('tc-ativo-'+id)||{}).checked};
  });
  mapa.cod_h=(document.getElementById('wt-codh')||{}).value||'';
  var txtCabV=((document.getElementById('wt-txtcab')||{}).value||'').trim();if(txtCabV)mapa.txt_cab=txtCabV;
  /* mantém configurações que não aparecem como cards (ex.: _estrutura) */
  var mapaAntes=(k&&db.empresas[k]&&db.empresas[k].mapeamento)||{};
  Object.keys(mapaAntes).forEach(function(x){if(x.charAt(0)==='_'&&!(x in mapa))mapa[x]=mapaAntes[x];});
  mapa._depreciacao=lerDeprForm();
  var id=k||docId(normCnpj(filiais[0].cnpj)||'emp_'+Date.now());
  st.textContent='Salvando…';st.className='status-msg';
  var antes=db.empresas[id];
  persistEmpresa(id,comRegistro(antes,{nome:nome,cnpj:filiais[0].cnpj,filial:filiais[0].fil,filiais:filiais,sistema:sis,mapeamento:mapa},antes?'alterou':'criou')).then(function(){
    st.textContent='Empresa salva.';st.className='status-msg ok';
    setTimeout(function(){var f=document.getElementById('emp-form');if(f)f.innerHTML='';},700);
  }).catch(function(err){st.textContent=msgErroBase(err);st.className='status-msg err';});
}

boot();
</script>
</body>
</html>
